[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edidio_control_py"
version = "0.5.0"
authors = [
    { name = "Michael Howes", email = "michael@creativelighting.com.au" }
]
description = "Python library for controlling the Control Freak eDIDIO S10 device."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "protobuf>=5.29.2"  # generated code validates the runtime at import
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
]

[tool.setuptools]
packages = ["edidio_control_py", "edidio_control_py._v2"]

[tool.setuptools.package-data]
"edidio_control_py._v2" = ["*.proto"]

[project.urls]
Homepage = "https://github.com/CreativeLightingAdmin/edidio_control_py"
